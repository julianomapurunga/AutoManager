services:
  app:
    build:
      context: .
      args:
        # Lidas do .env (na pasta do compose) e embutidas no bundle do cliente.
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
    image: vehiro:latest
    # Segredos de servidor (DATABASE_URL, SERVICE_ROLE, chaves Asaas, SMTP...)
    # entram em RUNTIME a partir do .env — nunca são embutidos na imagem.
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "5000"
    ports:
      # Exponha atrás de um reverse proxy com TLS (ver docs/deploy.md).
      - "5000:5000"
    volumes:
      # Uploads persistem entre reinícios do container.
      - vehiro_uploads:/app/uploads
    restart: unless-stopped

volumes:
  vehiro_uploads:
