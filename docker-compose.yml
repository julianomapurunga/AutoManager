services:
  app:
    build:
      context: .
      args:
        # Lidas do .env (na pasta do compose) e embutidas no bundle do cliente.
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
    image: vehiro:latest
    # Segredos de servidor (DATABASE_URL, SERVICE_ROLE, chaves Asaas, SMTP...)
    # entram em RUNTIME a partir do .env — nunca são embutidos na imagem.
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "5000"
    ports:
      # Só na loopback (127.0.0.1): a porta NÃO fica exposta na internet.
      # O acesso externo passa obrigatoriamente pelo reverse proxy com TLS
      # (que roda no mesmo host e encaminha para localhost:5000). Ver docs/deploy.md.
      - "127.0.0.1:5000:5000"
    volumes:
      # Uploads persistem entre reinícios do container.
      - vehiro_uploads:/app/uploads
    restart: unless-stopped

volumes:
  vehiro_uploads:
